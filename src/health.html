<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex">

  <title>Health Check | CloudOps Solutions</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: #172033;
      background: #f7f9fc;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .health-card {
      width: min(calc(100% - 32px), 480px);
      padding: 40px;
      border: 1px solid #e5eaf2;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 20px 55px rgba(32, 52, 89, 0.12);
      text-align: center;
    }

    .status-icon {
      display: grid;
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 50%;
      color: #087443;
      background: #e8fbf2;
      font-size: 2rem;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 10px;
      color: #6c768a;
    }

    code {
      display: block;
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      color: #174fc7;
      background: #eaf1ff;
      font-weight: 700;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: #246bfd;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="health-card">
    <div class="status-icon">✓</div>

    <h1>Service Healthy</h1>

    <p>The CloudOps Solutions website is available.</p>
    <p>Status: Operational</p>

    <code>HTTP 200 OK</code>

    <a href="index.html">Return to website</a>
  </main>
</body>
</html>
